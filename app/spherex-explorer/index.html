<script>
/* Apply saved preferences before first paint so there is no theme/language flash. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('sx.prefs.v1') || '{}'), d = document.documentElement;
    var mq = function (q) { return window.matchMedia && matchMedia(q).matches; };
    var th = p.theme || 'system';
    d.dataset.theme = th === 'light' ? 'light' : th === 'dark' ? 'dark' : (mq('(prefers-color-scheme: light)') ? 'light' : 'dark');
    d.dataset.level = p.level || 'beginner';
    if (p.lang === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; d.dataset.lang = 'ar'; }
    if (p.largeText) d.dataset.text = 'large';
    if (p.highContrast) d.dataset.contrast = 'high';
    var rm = p.reducedMotion == null ? mq('(prefers-reduced-motion: reduce)') : p.reducedMotion;
    if (rm) d.dataset.motion = 'reduced';
  } catch (e) { /* storage unavailable: defaults apply */ }
})();
</script>

        <div class="vh-text"><h1 id="h-comparison" tabindex="-1" data-i18n="cmp.title"></h1><p class="lead" data-i18n="cmp.lead"></p></div>
        <button type="button" class="btn sm only-phone" data-act="guide"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="nav.guide"></span></button>
      </header>
      <div class="page-tools"><div id="cmpSearch"></div></div>
      <div class="ctxbar" id="cmpCtx"></div>
      <div id="cmpGate" hidden></div>
      <div class="cmp-main" id="cmpMain" hidden>
        <div class="cmp-controls">
          <label class="field"><span data-i18n="cmp.before"></span><select id="cmpA"></select></label>
          <button type="button" class="rnd swapbtn" id="cmpSwap" data-i18n-attr="aria-label:cmp.swap;title:cmp.swap"><svg class="ic" aria-hidden="true"><use href="#i-swap"/></svg></button>
          <label class="field"><span data-i18n="cmp.after"></span><select id="cmpB"></select></label>
          <label class="field"><span data-i18n="cmp.band"></span><select id="cmpBand"></select></label>
          <div class="seg" id="cmpModes" role="radiogroup" data-i18n-attr="aria-label:cmp.mode"></div>
        </div>
        <div class="cmp-layout">
          <div class="cmp-stagewrap">
            <div id="cmp"></div>
            <div class="cmp-overlay" id="cmpOverlay" hidden></div>
          </div>
          <aside class="cmp-side" aria-live="polite">
            <section class="card" id="cmpResult"></section>
            <section class="card" data-min="intermediate">
              <h3 class="h3" data-i18n="cmp.display"></h3>
              <div class="kv"><div><label class="lbl" for="cmpBri" data-i18n="view.brightness"></label></div><strong id="cmpBriV" class="ltr"></strong></div>
              <input type="range" class="range" id="cmpBri" min="40" max="200" value="100">
              <div class="kv"><div><label class="lbl" for="cmpCon" data-i18n="view.contrast"></label></div><strong id="cmpConV" class="ltr"></strong></div>
              <input type="range" class="range" id="cmpCon" min="50" max="220" value="100">
            </section>
          </aside>
        </div>
      </div>
    </section>

    <!-- ============ HELP ============ -->
    <section class="view page" id="view-help" data-view="help" aria-labelledby="h-help" hidden>
      <header class="view-head">
        <div class="vh-text"><h1 id="h-help" tabindex="-1" data-i18n="help.title"></h1><p class="lead" data-i18n="help.lead"></p></div>
        <button type="button" class="btn solid sm" data-act="guide"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-i18n="guide.open"></span></button>
      </header>
      <div class="help-grid">
        <section class="card" aria-labelledby="hq">
          <h2 class="h3" id="hq" data-i18n="help.quick"></h2>
          <ol class="steps">
            <li><b data-i18n="help.s1t"></b> <span data-i18n="help.s1"></span></li>
            <li><b data-i18n="help.s2t"></b> <span data-i18n="help.s2"></span></li>
            <li><b data-i18n="help.s3t"></b> <span data-i18n="help.s3"></span></li>
            <li><b data-i18n="help.s4t"></b> <span data-i18n="help.s4"></span></li>
          </ol>
          <div class="row2">
            <button type="button" class="btn" data-act="replayOnboarding"><span data-i18n="help.replay"></span></button>
            <button type="button" class="btn" data-go="settings"><span data-i18n="help.openSettings"></span></button>
          </div>
        </section>
        <section class="card" aria-labelledby="hs">
          <h2 class="h3" id="hs" data-i18n="help.shortcuts"></h2>
          <dl class="keys">
            <dt><kbd>/</kbd></dt><dd data-i18n="help.k.search"></dd>
            <dt><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></dt><dd data-i18n="help.k.pan"></dd>
            <dt><kbd>+</kbd><kbd>−</kbd></dt><dd data-i18n="help.k.zoom"></dd>
            <dt><kbd>N</kbd><kbd>P</kbd></dt><dd data-i18n="help.k.cycle"></dd>
            <dt><kbd>Space</kbd></dt><dd data-i18n="help.k.play"></dd>
            <dt><kbd>[</kbd><kbd>]</kbd></dt><dd data-i18n="help.k.step"></dd>
            <dt><kbd>g</kbd> <kbd>e</kbd>/<kbd>o</kbd>/<kbd>c</kbd>/<kbd>h</kbd>/<kbd>s</kbd></dt><dd data-i18n="help.k.go"></dd>
            <dt><kbd>?</kbd></dt><dd data-i18n="help.k.help"></dd>
          </dl>
        </section>
        <section class="card wide" aria-labelledby="hg">
          <h2 class="h3" id="hg" data-i18n="help.glossary"></h2>
          <div class="gloss" id="glossary"></div>
        </section>
        <section class="card wide notice-card" aria-labelledby="hd">
          <h2 class="h3" id="hd" data-i18n="help.demoTitle"></h2>
          <p data-i18n="help.demoText"></p>
        </section>
      </div>
    </section>

    <!-- ============ SETTINGS ============ -->
    <section class="view page" id="view-settings" data-view="settings" aria-labelledby="h-settings" hidden>
      <header class="view-head">
        <div class="vh-text"><h1 id="h-settings" tabindex="-1" data-i18n="set.title"></h1><p class="lead" data-i18n="set.lead"></p></div>
      </header>
      <div class="settings-grid">
        <section class="card" aria-labelledby="sl"><h2 class="h3" id="sl" data-i18n="set.language"></h2><p class="muted small" data-i18n="set.languageHint"></p><div id="setLang"></div></section>
        <section class="card" aria-labelledby="st"><h2 class="h3" id="st" data-i18n="set.theme"></h2><p class="muted small" data-i18n="set.themeHint"></p><div id="setTheme"></div></section>
        <section class="card" aria-labelledby="se"><h2 class="h3" id="se" data-i18n="set.level"></h2><p class="muted small" data-i18n="set.levelHint"></p><div id="setLevel"></div></section>
        <section class="card" aria-labelledby="sa">
          <h2 class="h3" id="sa" data-i18n="set.access"></h2>
          <ul class="switches" id="setAccess"></ul>
          <p class="muted small" data-i18n="set.accessNote"></p>
        </section>
        <section class="card wide" aria-labelledby="sd">
          <h2 class="h3" id="sd" data-i18n="set.data"></h2>
          <p class="muted small" id="dataDesc"></p>
          <div id="demoControls" class="demo-controls"></div>
        </section>
        <section class="card wide" data-min="advanced" aria-labelledby="si">
          <h2 class="h3" id="si" data-i18n="set.inspector"></h2>
          <p class="muted small" data-i18n="set.inspectorHint"></p>
          <div class="table-wrap"><table class="inspector"><caption class="sr" data-i18n="set.inspector"></caption><thead><tr><th scope="col" data-i18n="insp.fn"></th><th scope="col" data-i18n="insp.args"></th><th scope="col" data-i18n="insp.status"></th><th scope="col" data-i18n="insp.ms"></th></tr></thead><tbody id="inspBody"></tbody></table></div>
        </section>
        <section class="card wide" aria-labelledby="sr">
          <h2 class="h3" id="sr" data-i18n="set.storage"></h2>
          <p class="muted small" data-i18n="set.storageHint"></p>
          <div class="row2 start">
            <button type="button" class="btn" data-act="replayOnboarding"><span data-i18n="help.replay"></span></button>
            <button type="button" class="btn danger" id="resetAll"><span data-i18n="set.resetAll"></span></button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <!-- ============ NAVIGATION: tab bar (phone) ============ -->
  <nav class="tabbar" id="tabbar" data-i18n-attr="aria-label:nav.main"><ul id="tabList"></ul></nav>
